# =============================================================================
# quarkus-notifications-app-client — consumer configuration reference
# =============================================================================
# Copy the relevant sections below into your own application.properties.

# -----------------------------------------------------------------------------
# APNs — Apple Push Notification service
#   Docs: https://developer.apple.com/documentation/usernotifications/sending-notification-requests-to-apns
# -----------------------------------------------------------------------------
# Sandbox (development / TestFlight):
#   quarkus.rest-client.apns.url=https://api.sandbox.push.apple.com
# Production (App Store):
#   quarkus.rest-client.apns.url=https://api.push.apple.com
#
# HTTP/2 is mandatory for APNs:
#   quarkus.rest-client.apns.http2=true
#
# Wire in your AbstractApnsTokenFilter implementation:
#   quarkus.rest-client.apns.providers=com.example.YourApnsTokenFilter

# -----------------------------------------------------------------------------
# FCM — Firebase Cloud Messaging v1
#   Docs: https://firebase.google.com/docs/cloud-messaging
# -----------------------------------------------------------------------------
#   quarkus.rest-client.fcm.url=https://fcm.googleapis.com
#
# Wire in your AbstractFcmTokenFilter implementation:
#   quarkus.rest-client.fcm.providers=com.example.YourFcmTokenFilter
